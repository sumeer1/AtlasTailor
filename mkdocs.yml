site_name: AtlasTailor
site_description: Atlas adaptation and developmental forecasting from sparse spatial measurements
site_url: https://atlastailor.readthedocs.io
repo_url: https://github.com/sumeer1/AtlasTailor
repo_name: sumeer1/AtlasTailor
theme:
  name: material
  features:
    - navigation.sections
    - navigation.indexes
    - content.code.copy
nav:
  - Home: index.md
  - Getting started:
      - Installation: installation.md
      - Quickstart: quickstart.md
      - Tutorials: tutorials.md
  - Concepts:
      - Pipeline: pipeline.md
      - Atlas adaptation: adapt.md
      - Panel design: design_panel.md
      - Atlas-relative residuals: residuals.md
      - Temporal forecasting: forecast.md
      - Scientific guardrails: scientific_guardrails.md
      - Statistical units: statistical_units.md
  - Data:
      - Data conventions: data_formats.md
      - Public data sources: data_sources.md
      - Preprocessing boundary: preprocessing.md
  - API reference:
      - Overview: api/index.md
      - Workflows: api/workflows.md
      - Input/output: api/io.md
      - Data objects: api/models.md
      - Configuration: api/configuration.md
      - Components: api/components.md
      - Command line: cli.md
  - Reproducibility:
      - Repository scope: repository_scope.md
      - Architecture and provenance: tool_architecture.md
      - Figure provenance: figure_provenance.md
      - Release validation: validation.md
      - Manuscript overview: manuscript_overview.md
  - FAQ: faq.md
  - Release and Zenodo: release_and_zenodo.md
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
