name: Bug report
description: Report incorrect or unexpected software behavior
body:
  - type: textarea
    id: summary
    attributes: {label: Summary, description: What happened and what did you expect?}
    validations: {required: true}
  - type: textarea
    id: reproduce
    attributes: {label: Reproduction, description: Minimal command or code and non-sensitive input schema}
    validations: {required: true}
  - type: textarea
    id: environment
    attributes: {label: Environment, description: AtlasTailor, Python, OS and dependency versions}
    validations: {required: true}
