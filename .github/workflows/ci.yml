name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix: {python-version: ["3.10", "3.11"]}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "${{ matrix.python-version }}"}
      - run: python -m pip install -U pip
      - run: python -m pip install -e '.[test]'
      - run: pytest -m 'not regression'
      - run: hyperspatial --version
  docs-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python -m pip install -U pip
      - run: python -m pip install -e '.[test,docs]'
      - run: python scripts/verify_release.py
      - run: python scripts/build_release_manifest.py && git diff --exit-code SHA256SUMS.tsv
      - run: mkdocs build --strict
      - run: python -m build
  notebook-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python -m pip install -U pip
      - run: python -m pip install -e '.[test,notebooks]'
      - run: python scripts/make_tiny_example.py
      - run: python scripts/execute_notebooks.py --smoke
